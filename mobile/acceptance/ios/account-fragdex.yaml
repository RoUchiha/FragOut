appId: app.fragout.mobile
name: Create an account, add Dior Sauvage, enlarge its photo and delete the account
---
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible: "Collection"
    timeout: 90000
- tapOn: "Open settings"
- tapOn: "Create account / sign in"
- assertVisible: "Account"
- tapOn:
    id: "account-name"
- inputText: "Simulator QA"
- tapOn:
    id: "account-email"
- inputText: "${QA_EMAIL}"
- tapOn:
    id: "account-password"
- inputText: "Simulator-fixture-pass-72"
- scrollUntilVisible:
    element:
      id: "submit-account"
    direction: DOWN
- tapOn:
    id: "submit-account"
    enabled: true
- extendedWaitUntil:
    visible: "Collection"
    timeout: 30000
- assertNotVisible: "Demo · fictional fragrances"
- tapOn: "Add"
# iOS may present Passwords over this sheet. The prompt lives outside FragOut's hierarchy.
- runFlow:
    when:
      notVisible: "Add fragrance"
    commands:
      - tapOn:
          text: "Not Now"
          optional: true
      - runFlow:
          when:
            notVisible: "Add fragrance"
          commands:
            - tapOn: "Add"
- extendedWaitUntil:
    visible: "Add fragrance"
    timeout: 20000
- tapOn:
    id: "bottle-brand"
- inputText: "Dior"
- tapOn:
    id: "bottle-name"
- inputText: "Sauvage"
- hideKeyboard
- tapOn: "EDP"
- scrollUntilVisible:
    element: "Save fragrance"
    direction: DOWN
- tapOn: "Save fragrance"
- extendedWaitUntil:
    visible:
      text: "Enlarge bottle thumbnail"
      enabled: true
    timeout: 30000
- tapOn: "Enlarge bottle thumbnail"
- assertVisible: "Sauvage"
- assertVisible: "Sauvage Eau de Parfum bottle"
- assertNotVisible: "FragDex"
- takeScreenshot: fragdex-enlarged-bottle
- tapOn: "Close"
- assertVisible: "FragDex"
- scrollUntilVisible:
    element: "Cross-checked notes"
    direction: DOWN
- tapOn: "Close"
- launchApp
- extendedWaitUntil:
    visible: "Details for Sauvage"
    timeout: 20000
- assertNotVisible: "Demo · fictional fragrances"
- tapOn: "Open settings"
- scrollUntilVisible:
    element: "Delete account"
    direction: DOWN
- tapOn: "Delete account"
- assertVisible: "Delete account"
- tapOn:
    id: "account-delete-confirmation"
- inputText: "DELETE"
- tapOn:
    text: "Permanently delete"
    enabled: true
- extendedWaitUntil:
    visible: "Demo · fictional fragrances"
    timeout: 30000
