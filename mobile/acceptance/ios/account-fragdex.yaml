appId: app.fragout.mobile
name: Create an account, add Dior Sauvage, enlarge its photo and delete the account
---
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible: "Collection"
    timeout: 90000
- tapOn: "Open settings"
- tapOn: "Create account / sign in"
- assertVisible: "Account"
- tapOn:
    id: "account-name"
- inputText: "Simulator QA"
# Let the sheet settle at its resting position before focusing the next input.
- pressKey: Enter
- waitForAnimationToEnd
- tapOn:
    id: "account-email"
- inputText: "${QA_EMAIL}"
- assertVisible:
    id: "account-email"
    text: "${QA_EMAIL}"
- pressKey: Enter
- waitForAnimationToEnd
- tapOn:
    id: "account-password"
- inputText: "Simulator-fixture-pass-72"
- scrollUntilVisible:
    element:
      id: "submit-account"
    direction: DOWN
- tapOn:
    id: "submit-account"
    enabled: true
- extendedWaitUntil:
    visible: "Collection"
    timeout: 30000
- assertNotVisible: "Demo · fictional fragrances"
# Passwords can appear after registration and consume the first tap on Add.
- retry:
    maxRetries: 1
    commands:
      - runFlow:
          when:
            notVisible: "Add fragrance"
          commands:
            - tapOn:
                text: "Not Now"
                optional: true
            - tapOn:
                text: "Add"
                retryTapIfNoChange: true
      - assertVisible: "Add fragrance"
- tapOn:
    id: "bottle-brand"
- inputText: "Dior"
- pressKey: Enter
- waitForAnimationToEnd
- tapOn:
    id: "bottle-name"
- inputText: "Sauvage"
- assertVisible:
    id: "bottle-name"
    text: "Sauvage"
- pressKey: Enter
- waitForAnimationToEnd
- tapOn: "EDP"
- scrollUntilVisible:
    element: "Save fragrance"
    direction: DOWN
- tapOn: "Save fragrance"
- extendedWaitUntil:
    visible:
      text: "Enlarge bottle thumbnail"
      enabled: true
    timeout: 30000
- tapOn: "Enlarge bottle thumbnail"
- assertVisible: "Sauvage"
- assertVisible: "Sauvage Eau de Parfum bottle"
- assertNotVisible: "FragDex"
- takeScreenshot: fragdex-enlarged-bottle
- tapOn: "Close"
- assertVisible: "FragDex"
- scrollUntilVisible:
    element: "Cross-checked notes"
    direction: DOWN
- tapOn: "Close"
- launchApp
- extendedWaitUntil:
    visible: "Details for Sauvage"
    timeout: 20000
- assertNotVisible: "Demo · fictional fragrances"
- tapOn: "Open settings"
- scrollUntilVisible:
    element: "Delete account"
    direction: DOWN
- tapOn: "Delete account"
- assertVisible: "Delete account"
- tapOn:
    id: "account-delete-confirmation"
- inputText: "DELETE"
- tapOn:
    text: "Permanently delete"
    enabled: true
- extendedWaitUntil:
    visible: "Demo · fictional fragrances"
    timeout: 30000
