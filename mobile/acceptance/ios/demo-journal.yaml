appId: app.fragout.mobile
name: Demo suggestions and wear journal across a relaunch
---
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible: "Collection"
    timeout: 90000
- assertVisible: "Demo · fictional fragrances"
- tapOn: "Find a scent"
- assertVisible: "Suggestions"
- tapOn: "Search fragrance suggestions"
- inputText: "tired clean work"
- hideKeyboard
- tapOn: "Find fragrances"
- scrollUntilVisible:
    element:
      text: "View .*"
      index: 0
    direction: DOWN
- tapOn:
    text: "View .*"
    index: 0
- scrollUntilVisible:
    element: "Wear this"
    direction: DOWN
- tapOn: "Wear this"
- tapOn: "Open journal"
- assertVisible: "Journal"
- extendedWaitUntil:
    visible: "WORK · Wore"
    timeout: 20000
- assertVisible: ".*Tired · Clean.*"
- launchApp
- extendedWaitUntil:
    visible: "Collection"
    timeout: 90000
- tapOn: "Open journal"
- assertVisible: "WORK · Wore"
