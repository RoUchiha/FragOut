appId: app.fragout.mobile
name: Native gallery upload, default deletion and opt-in private photo archive
---
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible: "Collection"
    timeout: 90000
- tapOn: "Find a scent"
- tapOn: "Match outfit"
- tapOn: "Choose photo"
- tapOn:
    id: "PXGGridLayout-Info"
    index: 0
- extendedWaitUntil:
    visible: "Remove photo"
    timeout: 45000
- tapOn: "Review outfit"
- extendedWaitUntil:
    visible: 'Photo not retained\.'
    timeout: 15000
- assertNotVisible: "Remove photo"
- tapOn: "Open settings"
# The switch can have an accessibility frame behind the bottom tabs before scrolling.
- scrollUntilVisible:
    element:
      id: "archive-outfits"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "archive-outfits"
- tapOn: "Open journal"
- tapOn: "Saved looks"
- extendedWaitUntil:
    visible: "No saved looks"
    timeout: 20000
- tapOn: "Find a scent"
- tapOn: "Match outfit"
- tapOn: "Choose photo"
- tapOn:
    id: "PXGGridLayout-Info"
    index: 0
- extendedWaitUntil:
    visible: "Remove photo"
    timeout: 45000
- tapOn: "Review outfit"
- extendedWaitUntil:
    visible: "Photo held privately for up to 15 minutes.*"
    timeout: 15000
- scrollUntilVisible:
    element: "Confirm outfit description"
    direction: DOWN
- tapOn: "Confirm outfit description"
- scrollUntilVisible:
    element: "Find matches"
    direction: DOWN
- tapOn: "Find matches"
- scrollUntilVisible:
    element:
      text: "View .*"
      index: 0
    direction: DOWN
- tapOn:
    text: "View .*"
    index: 0
- scrollUntilVisible:
    element: "Archive look"
    direction: DOWN
- tapOn: "Archive look"
- extendedWaitUntil:
    visible:
      text: "Archive look"
      enabled: true
    timeout: 20000
- tapOn: "Open journal"
- tapOn: "Saved looks"
- extendedWaitUntil:
    visible: "View look"
    timeout: 20000
- tapOn: "View look"
- extendedWaitUntil:
    visible: "Your privately archived outfit"
    timeout: 20000
- takeScreenshot: archived-outfit
- tapOn: "Close"
- tapOn: "Open settings"
- scrollUntilVisible:
    element:
      id: "archive-outfits"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "archive-outfits"
- tapOn: "Delete saved looks and turn off"
- extendedWaitUntil:
    notVisible: "Turn off archiving"
    timeout: 20000
- tapOn: "Open journal"
- tapOn: "Saved looks"
- assertVisible: "Outfit archive is off"
