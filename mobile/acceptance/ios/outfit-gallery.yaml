appId: app.fragout.mobile
name: Native gallery upload, default deletion and opt-in private photo archive
---
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible: "Collection"
    timeout: 30000
- tapOn: "Find a scent"
- tapOn: "Match outfit"
- tapOn: "Choose photo"
- tapOn:
    id: "PXGGridLayout-Info"
    index: 0
- extendedWaitUntil:
    visible: "Remove photo"
    timeout: 45000
- tapOn: "Review outfit"
- extendedWaitUntil:
    visible: 'Photo not retained\.'
    timeout: 15000
- assertNotVisible: "Remove photo"
- tapOn: "Open settings"
- scrollUntilVisible:
    element:
      id: "archive-outfits"
    direction: DOWN
- tapOn:
    id: "archive-outfits"
- assertVisible: 'Archiving enabled\. Save a selected look to keep its photo\.'
- tapOn: "Find a scent"
- tapOn: "Match outfit"
- tapOn: "Choose photo"
- tapOn:
    id: "PXGGridLayout-Info"
    index: 0
- extendedWaitUntil:
    visible: "Remove photo"
    timeout: 45000
- tapOn: "Review outfit"
- extendedWaitUntil:
    visible: "Photo held privately for up to 15 minutes.*"
    timeout: 15000
- scrollUntilVisible:
    element: "Confirm outfit description"
    direction: DOWN
- tapOn: "Confirm outfit description"
- scrollUntilVisible:
    element: "Find matches"
    direction: DOWN
- tapOn: "Find matches"
- scrollUntilVisible:
    element:
      text: "View .*"
      index: 0
    direction: DOWN
- tapOn:
    text: "View .*"
    index: 0
- scrollUntilVisible:
    element: "Archive look"
    direction: DOWN
- tapOn: "Archive look"
- assertVisible: 'Look and photo archived privately\.'
- tapOn: "Open journal"
- tapOn: "Saved looks"
- tapOn: "View look"
- assertVisible: "Your privately archived outfit"
- takeScreenshot: archived-outfit
- tapOn: "Close"
- tapOn: "Open settings"
- scrollUntilVisible:
    element:
      id: "archive-outfits"
    direction: DOWN
- tapOn:
    id: "archive-outfits"
- tapOn: "Delete saved looks and turn off"
- assertVisible: 'Archiving off\. Saved looks and photos deleted\.'
- tapOn: "Open journal"
- tapOn: "Saved looks"
- assertVisible: "Outfit archive is off"
