name: iOS acceptance

on:
  workflow_dispatch:
  push:
    branches: [qa/ios-acceptance]

permissions:
  contents: read

concurrency:
  group: ios-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    name: iPhone 17 simulator
    runs-on: macos-26
    timeout-minutes: 120
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_API_URL: http://localhost:3215
      FRAGOUT_PUBLIC_ORIGIN: http://localhost:3215
      FRAGOUT_OLLAMA_URL: http://127.0.0.1:11447
      MAESTRO_CLI_NO_ANALYTICS: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Prepare simulator and tooling
        run: |
          set -euo pipefail
          xcodebuild -version
          echo "FRAGOUT_XCODE_BUILD=$(xcodebuild -version | tail -n 1 | awk '{ print $3 }')" >> "$GITHUB_ENV"
          node --version
          mkdir -p "$RUNNER_TEMP/fragout-evidence"
          udid="$(xcrun simctl list devices available --json | jq -er \
            '.devices["com.apple.CoreSimulator.SimRuntime.iOS-26-5"] | map(select(.name == "iPhone 17")) | first | .udid')"
          echo "FRAGOUT_SIMULATOR=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid"

          curl --fail --silent --show-error --location --retry 3 \
            --output "$RUNNER_TEMP/maestro.zip" \
            https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.11.0/maestro.zip
          printf '5384593cb4e7a106489e75a821d157dd43f4e438df6bc308b72e82c685e1283a  %s\n' \
            "$RUNNER_TEMP/maestro.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/maestro/bin" >> "$GITHUB_PATH"
          echo "JAVA_HOME=$JAVA_HOME_17_arm64" >> "$GITHUB_ENV"

      - name: Install dependencies and verify mobile source
        run: |
          npm ci --include=dev
          npm ci --prefix mobile --include=dev
          npm run lint --prefix mobile
          npm run typecheck --prefix mobile

      - name: Build the API and prepare synthetic gallery photo
        run: |
          npm run build
          node --input-type=module -e '
            import sharp from "sharp";
            await sharp("tests/fixtures/outfit.svg").png().toFile(process.argv[1]);
          ' "$RUNNER_TEMP/fragout-outfit.png"
          xcrun simctl bootstatus "$FRAGOUT_SIMULATOR" -b
          xcrun simctl addmedia "$FRAGOUT_SIMULATOR" "$RUNNER_TEMP/fragout-outfit.png"

      - name: Restore the exact simulator build
        id: native-app
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/fragout-release/FragOut.app
          key: fragout-simulator-signed-${{ runner.arch }}-${{ env.FRAGOUT_XCODE_BUILD }}-${{ hashFiles('mobile/package-lock.json', 'mobile/package.json', 'mobile/app.config.ts', 'mobile/react-native.config.js', 'mobile/admob.config.cjs', 'mobile/metro.config.js', 'mobile/App.tsx', 'mobile/assets/**', 'mobile/src/**', 'src/lib/**') }}

      - name: Compile native release for the simulator architecture
        if: steps.native-app.outputs.cache-hit != 'true'
        timeout-minutes: 100
        working-directory: mobile
        env:
          EXPO_USE_PRECOMPILED_MODULES: '1'
          FRAGOUT_IOS_SIMULATOR_ACCEPTANCE: '1'
        run: |
          set -euo pipefail
          npx expo prebuild --platform ios --no-install
          pod install --project-directory=ios
          build="$RUNNER_TEMP/fragout-xcode"
          xcodebuild \
            -workspace ios/FragOut.xcworkspace \
            -scheme FragOut \
            -configuration Release \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$FRAGOUT_SIMULATOR,arch=arm64" \
            -derivedDataPath "$build" \
            -jobs 3 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- build \
            2>&1 | tee "$RUNNER_TEMP/fragout-evidence/xcode.log"
          mkdir -p "$RUNNER_TEMP/fragout-release"
          ditto "$build/Build/Products/Release-iphonesimulator/FragOut.app" "$RUNNER_TEMP/fragout-release/FragOut.app"

      - name: Save the compiled simulator app
        if: steps.native-app.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/fragout-release/FragOut.app
          key: ${{ steps.native-app.outputs.cache-primary-key }}

      - name: Install and verify the simulator app
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/fragout-release/FragOut.app"
          bundle_id="$(plutil -extract CFBundleIdentifier raw -o - "$app/Info.plist")"
          lipo "$app/FragOut" -verify_arch arm64
          codesign --verify --deep --strict "$app"
          xcrun simctl install "$FRAGOUT_SIMULATOR" "$app"
          xcrun simctl get_app_container "$FRAGOUT_SIMULATOR" "$bundle_id"

      - name: Exercise the native UI and private API
        timeout-minutes: 25
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/fragout-evidence"
          export FRAGOUT_DB="$RUNNER_TEMP/fragout-private/state.sqlite"
          export FRAGOUT_IOS_QA_EMAIL="ios-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT@example.test"
          node tests/fixtures/qwen-server.mjs 11447 > "$evidence/qwen-fixture.log" 2>&1 &
          model_pid=$!
          node node_modules/next/dist/bin/next start --hostname 127.0.0.1 --port 3215 > "$evidence/api.log" 2>&1 &
          api_pid=$!
          trap 'kill "$model_pid" "$api_pid" 2>/dev/null || true' EXIT
          for ((attempt=0; attempt<50; attempt++)); do
            status="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3215/api/state || true)"
            if [[ "$status" == 401 ]] && curl --silent --fail http://127.0.0.1:11447/api/tags >/dev/null; then
              break
            fi
            if [[ "$attempt" == 49 ]]; then
              cat "$evidence/api.log"
              exit 1
            fi
            sleep 1
          done

          xcrun simctl launch "$FRAGOUT_SIMULATOR" app.fragout.mobile
          maestro --version
          maestro_status=0
          maestro --no-ansi --device "$FRAGOUT_SIMULATOR" test \
            --format junit --output "$evidence/results.xml" \
            --test-output-dir "$evidence/maestro" \
            -e "QA_EMAIL=$FRAGOUT_IOS_QA_EMAIL" \
            mobile/acceptance/ios || maestro_status=$?
          node --input-type=module -e '
            import assert from "node:assert/strict";
            import {DatabaseSync} from "node:sqlite";
            const db = new DatabaseSync(process.env.FRAGOUT_DB, {readOnly: true});
            assert.equal(db.prepare("SELECT COUNT(*) AS count FROM private_photos").get().count, 0);
            assert.equal(db.prepare("SELECT COUNT(*) AS count FROM saved_looks").get().count, 0);
            if (process.argv[1] === "0") {
              assert.equal(db.prepare("SELECT COUNT(*) AS count FROM users WHERE email=?")
                .get(process.env.FRAGOUT_IOS_QA_EMAIL).count, 0);
              console.log("The registered test account was deleted.");
            }
            db.close();
            console.log("The test database contains zero private photos and saved looks.");
          ' "$maestro_status"
          exit "$maestro_status"

      - name: Preserve simulator evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ios-simulator-evidence
          path: ${{ runner.temp }}/fragout-evidence
          retention-days: 14
